<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="scope" aria-hidden="true"><span class="scope-ring"></span><span class="scope-sweep"></span><span class="scope-dot"></span></div>
      <div>
        <h1>Token Radar</h1>
        <p class="tagline">Protocols that record no token yet, ranked by what their token would be worth on today's record — and how to farm each one before it launches.</p>
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
  </div>
  <div class="model-note" id="model-note"></div>
</header>

<main>
  <section class="controls" aria-label="Board controls">
    <div class="tabs" role="tablist">
      <button type="button" id="tab-board" class="tab active" role="tab">Pre-token board</button>
      <button type="button" id="tab-live" class="tab" role="tab">Already trading</button>
    </div>
    <div class="filters">
      <label class="field grow">Search
        <input type="search" id="q" placeholder="Protocol name or slug…" autocomplete="off">
      </label>
      <label class="field">Category
        <select id="category"><option value="">All categories</option></select>
      </label>
      <label class="field">Chain
        <select id="chain"><option value="">All chains</option></select>
      </label>
      <label class="check">
        <input type="checkbox" id="watchlist-only"> Watchlist only
      </label>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="board-wrap">
    <table class="board" id="board-table">
      <thead id="board-head"></thead>
      <tbody id="board-body"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No protocol matches those filters. Loosen the search or clear a filter.</p>
  </section>

  <footer class="foot" id="foot"></footer>
</main>

<aside class="drawer" id="drawer" hidden aria-label="Protocol detail">
  <div class="drawer-card">
    <button type="button" class="drawer-close" id="drawer-close" aria-label="Close detail">×</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
